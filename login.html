
<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login Planner</title>

<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

  <div class="login-box">

    <img
      src="logo.png"
      width="80"
      alt="Logo"
    >

    <h2>Planner Turni</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

<div style="position:relative; width:100%;">
  <input
    type="password"
    id="password"
    placeholder="Password"
    style="width:100%; padding-right:45px; box-sizing:border-box;"
  >

  <button
    type="button"
    onclick="togglePassword()"
    style="
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:none;
      cursor:pointer;
      font-size:20px;
      padding:0;
    "
    aria-label="Mostra password"
  >👁️</button>
</div>

<button
  id="forgotPasswordBtn"
  type="button"
  onclick="resetPassword()"
  style="display:none;background:none;border:none;color:#007bff;text-decoration:underline;cursor:pointer;margin-top:15px;"
>
  Hai dimenticato la password?
</button>

    <button onclick="login()">
      Accedi
    </button>

  </div>

</div>

<script
  type="module"
  src="login.js"
></script>

</body>

</html>
