<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuova password - Planner REP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .reset-container {
      width: 100%;
      max-width: 400px;
      padding: 30px 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 25px;
      text-align: center;
      color: #666;
      font-size: 15px;
    }

    .password-field {
      position: relative;
      margin-bottom: 18px;
    }

    .password-field input {
      width: 100%;
      height: 48px;
      padding: 0 50px 0 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .password-field input:focus {
      outline: none;
      border-color: #777;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      padding: 5px;
      cursor: pointer;
      font-size: 20px;
    }

    .reset-button {
      width: 100%;
      height: 48px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .reset-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="reset-container">

    <h1>Nuova password</h1>

    <p class="subtitle">
      Inserisci la nuova password e confermala.
    </p>

    <div class="password-field">
      <input
        type="text"
        id="newPassword"
        placeholder="Nuova password"
        autocomplete="new-password"
      >

      <button
        type="button"
        class="password-toggle"
        id="toggleNewPassword"
        aria-label="Nascondi password"
      >👁️</button>
    </div>

    <div class="password-field">
      <input
        type="text"
        id="confirmPassword"
        placeholder="Conferma password"
        autocomplete="new-password"
      >

      <button
        type="button"
        class="password-toggle"
        id="toggleConfirmPassword"
        aria-label="Nascondi password"
      >👁️</button>
    </div>

    <button
      type="button"
      class="reset-button"
      id="resetButton"
    >
      Salva nuova password
    </button>

    <div id="message"></div>

  </div>

  <script type="module">

    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCKQp_DA2Bjbs6g27Wwl8eo_kyzzI2A40",
      authDomain: "calendario-rep.firebaseapp.com",
      projectId: "calendario-rep",
      storageBucket: "calendario-rep.firebasestorage.app",
      messagingSenderId: "1067128179274",
      appId: "1:1067128179274:web:e1c7174c25bdabee2ff4b3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");

    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    function setMessage(text) {
      message.textContent = text;
    }

    // Verifica che il link Firebase sia valido
    if (mode !== "resetPassword" || !oobCode) {

      resetButton.disabled = true;
      newPassword.disabled = true;
      confirmPassword.disabled = true;

      setMessage("❌ Link di recupero non valido.");

    } else {

      try {

        await verifyPasswordResetCode(auth, oobCode);

      } catch (error) {

        console.error("Errore verifica link:", error);

        resetButton.disabled = true;
        newPassword.disabled = true;
        confirmPassword.disabled = true;

        setMessage("❌ Il link è scaduto o non è più valido.");
      }
    }

    // 👁️ Mostra / nascondi nuova password
    document.getElementById("toggleNewPassword").addEventListener("click", () => {

      if (newPassword.type === "password") {

        newPassword.type = "text";

        document.getElementById("toggleNewPassword").textContent = "👁️";
        document.getElementById("toggleNewPassword").setAttribute(
          "aria-label",
          "Nascondi password"
        );

      } else {

        newPassword.type = "password";

        document.getElementById("toggleNewPassword").textContent = "🙈";
        document.getElementById("toggleNewPassword").setAttribute(
          "aria-label",
          "Mostra password"
        );
      }
    });

    // 👁️ Mostra / nascondi conferma password
    document.getElementById("toggleConfirmPassword").addEventListener("click", () => {

      if (confirmPassword.type === "password") {

        confirmPassword.type = "text";

        document.getElementById("toggleConfirmPassword").textContent = "👁️";
        document.getElementById("toggleConfirmPassword").setAttribute(
          "aria-label",
          "Nascondi password"
        );

      } else {

        confirmPassword.type = "password";

        document.getElementById("toggleConfirmPassword").textContent = "🙈";
        document.getElementById("toggleConfirmPassword").setAttribute(
          "aria-label",
          "Mostra password"
        );
      }
    });

    // Salva nuova password
    resetButton.addEventListener("click", async () => {

      const password = newPassword.value;
      const confirmation = confirmPassword.value;

      if (!password || !confirmation) {

        setMessage("⚠️ Inserisci entrambe le password.");

        return;
      }

      if (password.length < 6) {

        setMessage("⚠️ La password deve contenere almeno 6 caratteri.");

        return;
      }

      if (password !== confirmation) {

        setMessage("❌ Le password non coincidono.");

        return;
      }

      resetButton.disabled = true;
      setMessage("Salvataggio password...");

      try {

        await confirmPasswordReset(auth, oobCode, password);

        setMessage("✅ Password modificata correttamente.");

        newPassword.disabled = true;
        confirmPassword.disabled = true;

        resetButton.textContent = "Password salvata";

      } catch (error) {

        console.error("Errore cambio password:", error);

        resetButton.disabled = false;

        setMessage("❌ Impossibile modificare la password. Il link potrebbe essere scaduto.");
      }
    });

  </script>

</body>
</html>
